<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arena Shooter</title>
<style>
  /* ---------- Page & overlay styling ---------- */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; user-select: none; }
  canvas { display: block; }

  #hud { position: fixed; inset: 0; pointer-events: none; }
  .hidden { display: none !important; }

  /* Crosshair: four small bars around the centre */
  #crosshair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  #crosshair i { position: absolute; background: rgba(255,255,255,0.9); box-shadow: 0 0 2px #000; }
  #crosshair i:nth-child(1) { left: -1px; top: -12px; width: 2px; height: 7px; }
  #crosshair i:nth-child(2) { left: -1px; top: 5px;  width: 2px; height: 7px; }
  #crosshair i:nth-child(3) { top: -1px; left: -12px; width: 7px; height: 2px; }
  #crosshair i:nth-child(4) { top: -1px; left: 5px;  width: 7px; height: 2px; }
  #crosshair i:nth-child(5) { left: -1px; top: -1px; width: 2px; height: 2px; }

  /* Hit marker: an X that flashes when a shot lands on an enemy */
  #hitmarker { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; opacity: 0; transition: opacity 0.12s; }
  #hitmarker::before, #hitmarker::after { content: ""; position: absolute; left: 12px; top: 0; width: 2px; height: 26px; background: #ff4040; }
  #hitmarker::before { transform: rotate(45deg); }
  #hitmarker::after  { transform: rotate(-45deg); }
  #hitmarker.show { opacity: 1; transition: none; }

  .panel { position: absolute; background: rgba(0,0,0,0.45); border-radius: 8px; padding: 10px 14px; text-shadow: 0 1px 2px #000; }
  #health-panel { left: 20px; bottom: 20px; width: 260px; }
  .label { font-size: 12px; letter-spacing: 0.12em; opacity: 0.8; }
  #health-bar { margin-top: 6px; height: 14px; background: rgba(255,255,255,0.15); border-radius: 7px; overflow: hidden; }
  #health-fill { height: 100%; width: 100%; background: #3ddc6a; transition: width 0.15s, background 0.3s; }
  #health-text { font-size: 22px; font-weight: 700; margin-top: 4px; }

  #ammo-panel { right: 20px; bottom: 20px; text-align: right; min-width: 140px; }
  #ammo { font-size: 34px; font-weight: 800; }
  #ammo small { font-size: 18px; opacity: 0.7; }
  #reload-text { font-size: 13px; color: #ffd84d; height: 16px; }

  #score-panel { left: 20px; top: 20px; }
  #wave-panel  { right: 20px; top: 20px; text-align: right; }
  .big { font-size: 26px; font-weight: 800; }
  #enemies-left { font-size: 13px; opacity: 0.8; }
  #fps { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); font-size: 11px; opacity: 0.5; }

  #banner { position: absolute; left: 0; right: 0; top: 28%; text-align: center; font-size: 48px; font-weight: 900; letter-spacing: 0.1em; text-shadow: 0 3px 10px #000; opacity: 0; transition: opacity 0.4s; }
  #banner.show { opacity: 1; }

  /* Red vignette when the player takes damage */
  #damage { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at center, rgba(255,0,0,0) 45%, rgba(200,0,0,0.85) 100%); }

  /* Full-screen menus */
  .screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(5,10,20,0.78); }
  .card { background: rgba(20,28,45,0.95); border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; padding: 28px 36px; max-width: 460px; width: calc(100% - 32px); box-sizing: border-box; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .card h1 { margin: 0 0 6px; font-size: 38px; letter-spacing: 0.08em; }
  .card p { opacity: 0.8; margin: 6px 0 18px; }
  .controls { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; text-align: left; margin: 0 auto 22px; width: fit-content; font-size: 15px; }
  kbd { display: inline-block; min-width: 18px; padding: 2px 7px; border-radius: 5px; background: #2d3a55; border: 1px solid #4a5a7c; font-family: inherit; font-size: 13px; text-align: center; }
  button { font: inherit; font-size: 18px; font-weight: 700; padding: 12px 34px; border: 0; border-radius: 10px; background: #ff5a3c; color: #fff; cursor: pointer; }
  button:hover { background: #ff7559; }
  .final { font-size: 52px; font-weight: 900; margin: 8px 0 4px; color: #ffd84d; }
</style>
</head>
<body>

<!-- ============ HUD ============ -->
<div id="hud" class="hidden">
  <div id="damage"></div>
  <div id="crosshair"><i></i><i></i><i></i><i></i><i></i></div>
  <div id="hitmarker"></div>
  <div id="fps"></div>
  <div id="banner"></div>

  <div id="score-panel" class="panel"><div class="label">SCORE</div><div id="score" class="big">0</div></div>
  <div id="wave-panel" class="panel"><div class="label">WAVE</div><div id="wave" class="big">1</div><div id="enemies-left"></div></div>

  <div id="health-panel" class="panel">
    <div class="label">HEALTH</div>
    <div id="health-bar"><div id="health-fill"></div></div>
    <div id="health-text">100</div>
  </div>

  <div id="ammo-panel" class="panel">
    <div class="label">AMMO</div>
    <div id="ammo">12<small> / 12</small></div>
    <div id="reload-text"></div>
  </div>
</div>

<!-- ============ Start screen ============ -->
<div id="start-screen" class="screen">
  <div class="card">
    <h1>ARENA SHOOTER</h1>
    <p>Survive the waves. Each one is bigger and faster.</p>
    <div class="controls">
      <span><kbd>Mouse</kbd></span><span>Look around</span>
      <span><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd></span><span>Move</span>
      <span><kbd>Shift</kbd></span><span>Sprint</span>
      <span><kbd>Space</kbd></span><span>Jump</span>
      <span><kbd>Left click</kbd></span><span>Shoot (hold for auto)</span>
      <span><kbd>R</kbd></span><span>Reload</span>
      <span><kbd>Esc</kbd></span><span>Pause</span>
    </div>
    <button id="start-btn">START</button>
  </div>
</div>

<!-- ============ Pause screen ============ -->
<div id="pause-screen" class="screen hidden">
  <div class="card">
    <h1>PAUSED</h1>
    <p>Click below to jump back in.</p>
    <button id="resume-btn">RESUME</button>
  </div>
</div>

<!-- ============ Game-over screen ============ -->
<div id="gameover-screen" class="screen hidden">
  <div class="card">
    <h1>GAME OVER</h1>
    <p>Final score</p>
    <div id="final-score" class="final">0</div>
    <p id="final-wave">You reached wave 1</p>
    <button id="restart-btn">RESTART</button>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* =====================================================================
   CONFIG — every gameplay number lives here, so tuning is one place.
   ===================================================================== */
const CONFIG = {
  player: {
    maxHealth: 100,
    walkSpeed: 6,          // units per second
    sprintSpeed: 10,
    jumpSpeed: 7.2,        // initial upward velocity (enough to jump onto 1.2-high boxes)
    gravity: 20,
    radius: 0.4,           // collision radius
    height: 1.75,          // body height
    eyeHeight: 1.6,        // camera height above feet
    mouseSensitivity: 0.0022,
  },
  weapon: {
    magSize: 12,           // bullets per magazine
    fireRate: 7,           // shots per second while holding the mouse
    reloadTime: 1.3,       // seconds
    damage: 1,             // damage per bullet
    range: 120,
    recoilKick: 0.012,     // how far the view kicks up per shot (radians)
  },
  enemy: {
    baseSpeed: 3.0,        // speed on wave 1
    speedPerWave: 0.45,    // added each wave
    maxSpeed: 9.5,         // speed never goes above this
    speedVariance: 0.15,   // each enemy is +/- 15% of the wave speed
    contactDamage: 10,     // health removed per touch
    attackCooldown: 0.8,   // seconds between touches from the same enemy
    baseHealth: 2,         // bullets to kill on wave 1
    healthEveryNWaves: 3,  // +1 health every N waves
    radius: 0.55,
    scorePerKill: 100,
  },
  waves: {
    baseCount: 5,          // enemies in wave 1
    extraPerWave: 3,       // extra enemies each new wave
    maxAlive: 30,          // cap on enemies alive at once (performance)
    spawnInterval: 0.7,    // seconds between spawns inside a wave
    timeBetweenWaves: 3,   // pause after clearing a wave
    healOnClear: 20,       // health restored when a wave is cleared
    clearBonusPerWave: 250,// bonus score = this * wave number
  },
  arena: {
    size: 60,              // the arena is size x size
    wallHeight: 6,
  },
  visual: {
    skyColor: 0x8ec5ff,
    maxPixelRatio: 1.5,    // lower to 1 if your laptop struggles
    shadows: true,
  },
};

/* =====================================================================
   DOM handles
   ===================================================================== */
const $ = (id) => document.getElementById(id);
const ui = {
  hud: $('hud'), start: $('start-screen'), pause: $('pause-screen'), over: $('gameover-screen'),
  score: $('score'), wave: $('wave'), enemiesLeft: $('enemies-left'),
  healthFill: $('health-fill'), healthText: $('health-text'),
  ammo: $('ammo'), reloadText: $('reload-text'),
  hitmarker: $('hitmarker'), damage: $('damage'), banner: $('banner'), fps: $('fps'),
  finalScore: $('final-score'), finalWave: $('final-wave'),
};

/* =====================================================================
   Renderer, scene, cameras
   ===================================================================== */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, CONFIG.visual.maxPixelRatio));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = CONFIG.visual.shadows;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.autoClear = false;                 // we draw the world, then the gun on top
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(CONFIG.visual.skyColor);
scene.fog = new THREE.Fog(CONFIG.visual.skyColor, 45, 120);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 250);
camera.rotation.order = 'YXZ';              // yaw first, then pitch: standard FPS look
scene.add(camera);

// The gun is drawn in its own little scene so it never clips into walls.
const gunScene = new THREE.Scene();
const gunCamera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 10);
gunScene.add(new THREE.HemisphereLight(0xdfefff, 0x404050, 2.0));
const gunSun = new THREE.DirectionalLight(0xffffff, 1.8);
gunSun.position.set(1, 2, 1);
gunScene.add(gunSun);

/* ---------- Lighting ---------- */
scene.add(new THREE.HemisphereLight(0xcfe6ff, 0x5a4a3a, 1.1));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(25, 45, 15);
sun.castShadow = CONFIG.visual.shadows;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera;
sc.left = -38; sc.right = 38; sc.top = 38; sc.bottom = -38; sc.near = 1; sc.far = 120;
sun.shadow.bias = -0.0005;
scene.add(sun);

// Muzzle light: always in the scene (intensity 0 when idle) so shaders never recompile.
const muzzleLight = new THREE.PointLight(0xffc060, 0, 10, 2);
scene.add(muzzleLight);

/* =====================================================================
   Level: floor, walls, crates, platforms
   Every solid box is stored in `obstacles` as an axis-aligned box for collision.
   ===================================================================== */
const obstacles = [];      // { min: Vector3, max: Vector3 }
const solidMeshes = [];    // meshes bullets can hit

// Small procedural texture for the floor (drawn in code, no image files)
function makeGridTexture(base, line, cells) {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, 256, 256);
  g.strokeStyle = line; g.lineWidth = 3;
  const step = 256 / cells;
  for (let i = 0; i <= cells; i++) {
    g.beginPath(); g.moveTo(i * step, 0); g.lineTo(i * step, 256); g.stroke();
    g.beginPath(); g.moveTo(0, i * step); g.lineTo(256, i * step); g.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

// Crate texture: planks with a border
function makeCrateTexture(base, dark) {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, 128, 128);
  g.strokeStyle = dark; g.lineWidth = 10; g.strokeRect(5, 5, 118, 118);
  g.lineWidth = 8; g.beginPath(); g.moveTo(10, 10); g.lineTo(118, 118); g.stroke();
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const S = CONFIG.arena.size / 2;
const floorTex = makeGridTexture('#6d7a62', '#5b6752', 4);
floorTex.repeat.set(CONFIG.arena.size / 4, CONFIG.arena.size / 4);
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(CONFIG.arena.size, CONFIG.arena.size),
  new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.95 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);
solidMeshes.push(floor);

const MAT = {
  wall:     new THREE.MeshStandardMaterial({ color: 0x9aa3b5, roughness: 0.9 }),
  crate:    new THREE.MeshStandardMaterial({ map: makeCrateTexture('#b07a3c', '#7a4f22'), roughness: 0.8 }),
  crate2:   new THREE.MeshStandardMaterial({ map: makeCrateTexture('#8a8f45', '#5c602a'), roughness: 0.8 }),
  platform: new THREE.MeshStandardMaterial({ color: 0x5f6f8f, roughness: 0.7 }),
  pillar:   new THREE.MeshStandardMaterial({ color: 0xc9b89a, roughness: 0.85 }),
  cover:    new THREE.MeshStandardMaterial({ color: 0x7d8595, roughness: 0.85 }),
};

/** Add a solid box. (cx, cz) = centre on the floor, w/h/d = size, y0 = bottom height. */
function addBox(cx, cz, w, h, d, material, y0 = 0) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  mesh.position.set(cx, y0 + h / 2, cz);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  solidMeshes.push(mesh);
  obstacles.push({
    min: new THREE.Vector3(cx - w / 2, y0, cz - d / 2),
    max: new THREE.Vector3(cx + w / 2, y0 + h, cz + d / 2),
  });
  return mesh;
}

// Outer walls
const WH = CONFIG.arena.wallHeight, AS = CONFIG.arena.size;
addBox(0, -S - 0.5, AS + 2, WH, 1, MAT.wall);
addBox(0,  S + 0.5, AS + 2, WH, 1, MAT.wall);
addBox(-S - 0.5, 0, 1, WH, AS, MAT.wall);
addBox( S + 0.5, 0, 1, WH, AS, MAT.wall);

// Centre platform (jumpable, 1.1 high) with a crate on top for extra height
addBox(0, 0, 8, 1.1, 8, MAT.platform);
addBox(-2.5, -2.5, 1.5, 1.0, 1.5, MAT.crate, 1.1);

// Four corner platforms (2.0 high) — reach them by jumping on the step crate first
const corners = [[-19, -19], [19, -19], [-19, 19], [19, 19]];
for (const [x, z] of corners) {
  addBox(x, z, 7, 2.0, 7, MAT.platform);
  // step crate on the side facing the centre
  addBox(x - Math.sign(x) * 4.6, z, 2.2, 1.0, 2.2, MAT.crate);
}

// Pillars
for (const [x, z] of [[-10, 0], [10, 0], [0, -11], [0, 11]]) addBox(x, z, 1.6, 4.5, 1.6, MAT.pillar);

// Low cover walls
addBox(-8, -18, 6, 1.4, 0.8, MAT.cover);
addBox( 8,  18, 6, 1.4, 0.8, MAT.cover);
addBox(-20, 6, 0.8, 1.4, 6, MAT.cover);
addBox( 20, -6, 0.8, 1.4, 6, MAT.cover);

// Scattered crates (x, z, size, material)
const crateList = [
  [-14, 8, 1.4, MAT.crate], [-13.2, 9.6, 1.0, MAT.crate2], [14, -9, 1.4, MAT.crate],
  [6, -6.5, 1.2, MAT.crate2], [-6, 7, 1.2, MAT.crate], [16, 12, 1.6, MAT.crate2],
  [-16, -11, 1.6, MAT.crate], [4, 22, 1.2, MAT.crate], [-5, -24, 1.4, MAT.crate2],
  [24, 2, 1.2, MAT.crate], [-24, -3, 1.2, MAT.crate2], [11, 24, 1.0, MAT.crate2],
];
for (const [x, z, s, m] of crateList) addBox(x, z, s, s, s, m);

/* =====================================================================
   Collision helpers (circle in XZ vs axis-aligned boxes)
   ===================================================================== */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

/**
 * Push a circle (centre pos.x/pos.z, radius r, vertical span bottom..top) out of every box.
 * Boxes whose top is below `bottom` are ignored (you're standing on / flying over them).
 * Returns true if the circle was pushed (i.e. it bumped into something).
 */
function collideCircle(pos, r, bottom, top) {
  let pushed = false;
  for (const b of obstacles) {
    if (bottom >= b.max.y - 0.06 || top <= b.min.y) continue;
    const cx = clamp(pos.x, b.min.x, b.max.x);
    const cz = clamp(pos.z, b.min.z, b.max.z);
    const dx = pos.x - cx, dz = pos.z - cz;
    const d2 = dx * dx + dz * dz;
    if (d2 >= r * r) continue;
    pushed = true;
    if (d2 > 1e-8) {
      const d = Math.sqrt(d2), push = r - d;
      pos.x += (dx / d) * push;
      pos.z += (dz / d) * push;
    } else {
      // Centre is inside the box: leave by the nearest side.
      const left = pos.x - b.min.x, right = b.max.x - pos.x;
      const back = pos.z - b.min.z, front = b.max.z - pos.z;
      const m = Math.min(left, right, back, front);
      if (m === left) pos.x = b.min.x - r;
      else if (m === right) pos.x = b.max.x + r;
      else if (m === back) pos.z = b.min.z - r;
      else pos.z = b.max.z + r;
    }
  }
  return pushed;
}

/** Does a circle overlap a box's footprint in XZ? */
function overlapsXZ(pos, r, b) {
  const cx = clamp(pos.x, b.min.x, b.max.x);
  const cz = clamp(pos.z, b.min.z, b.max.z);
  const dx = pos.x - cx, dz = pos.z - cz;
  return dx * dx + dz * dz < r * r;
}

/* =====================================================================
   Sound effects — all synthesised with the Web Audio API
   ===================================================================== */
const Sound = {
  ctx: null, master: null, noiseBuf: null,

  init() {
    if (this.ctx) { this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.45;
    this.master.connect(this.ctx.destination);
    // One second of white noise, reused by every noise-based effect
    const len = this.ctx.sampleRate;
    this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const data = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  },

  /** A pitched tone that sweeps from f0 to f1 and fades out. */
  tone(type, f0, f1, dur, vol, delay = 0) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f0, t);
    osc.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(g).connect(this.master);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  },

  /** A filtered noise burst (gunshots, clicks, explosions). */
  noise(dur, filterType, f0, f1, vol, delay = 0) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime + delay;
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    const filter = this.ctx.createBiquadFilter();
    filter.type = filterType;
    filter.frequency.setValueAtTime(f0, t);
    filter.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(filter).connect(g).connect(this.master);
    src.start(t, Math.random() * 0.5);
    src.stop(t + dur + 0.02);
  },

  shoot()  { this.noise(0.16, 'lowpass', 5000, 300, 0.9); this.tone('sine', 160, 45, 0.12, 0.7); },
  hit()    { this.tone('square', 900, 1500, 0.05, 0.18); this.noise(0.06, 'highpass', 3000, 3000, 0.25); },
  kill()   { this.tone('sawtooth', 520, 60, 0.35, 0.25); this.noise(0.3, 'bandpass', 1500, 150, 0.5); },
  empty()  { this.tone('square', 1300, 1300, 0.025, 0.15); },
  hurt()   { this.tone('sawtooth', 200, 70, 0.25, 0.4); },
  jump()   { this.tone('sine', 220, 330, 0.08, 0.08); },
  wave()   { this.tone('triangle', 440, 440, 0.15, 0.25); this.tone('triangle', 660, 660, 0.25, 0.25, 0.15); },
  reload() {
    const t = CONFIG.weapon.reloadTime;
    this.noise(0.05, 'bandpass', 2200, 2200, 0.6, 0.05);      // mag out
    this.tone('square', 400, 300, 0.04, 0.1, 0.06);
    this.noise(0.06, 'bandpass', 1600, 1600, 0.7, t * 0.6);   // mag in
    this.noise(0.04, 'bandpass', 3000, 3000, 0.6, t * 0.9);   // slide click
    this.tone('square', 900, 700, 0.03, 0.12, t * 0.9);
  },
};

/* =====================================================================
   Weapon model (built from boxes and cylinders) + muzzle flash
   ===================================================================== */
const gun = new THREE.Group();
const gunMetal = new THREE.MeshStandardMaterial({ color: 0x3a3f48, metalness: 0.3, roughness: 0.4 });
const gunAccent = new THREE.MeshStandardMaterial({ color: 0xff5a3c, metalness: 0.2, roughness: 0.5 });
const gunGrip = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9 });
{
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.11, 0.42), gunMetal);
  gun.add(body);
  const top = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.03, 0.36), gunAccent);
  top.position.set(0, 0.07, -0.02);
  gun.add(top);
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.26, 12), gunMetal);
  barrel.rotation.x = Math.PI / 2;
  barrel.position.set(0, 0.015, -0.33);
  gun.add(barrel);
  const grip = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.18, 0.09), gunGrip);
  grip.position.set(0, -0.12, 0.12);
  grip.rotation.x = 0.25;
  gun.add(grip);
  const mag = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.14, 0.07), gunMetal);
  mag.position.set(0, -0.1, -0.06);
  gun.add(mag);
  const sight = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.03, 0.02), gunAccent);
  sight.position.set(0, 0.1, -0.18);
  gun.add(sight);
}
// Muzzle flash: two crossed glowing quads + a core, hidden until we fire
const muzzleFlash = new THREE.Group();
{
  const flashMat = new THREE.MeshBasicMaterial({ color: 0xffd27a, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
  const quad = new THREE.PlaneGeometry(0.16, 0.16);
  const a = new THREE.Mesh(quad, flashMat);
  const b = new THREE.Mesh(quad, flashMat); b.rotation.y = Math.PI / 2;
  const c = new THREE.Mesh(quad, flashMat); c.rotation.x = Math.PI / 2;
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  muzzleFlash.add(a, b, c, core);
  muzzleFlash.position.set(0, 0.015, -0.5);
  muzzleFlash.visible = false;
  gun.add(muzzleFlash);
}
const GUN_REST = new THREE.Vector3(0.16, -0.15, -0.42);   // where the gun sits on screen
gun.scale.setScalar(0.5);                                 // shrink/grow the whole gun here
gun.position.copy(GUN_REST);
gunScene.add(gun);

/* =====================================================================
   Particles (sparks for hits, dust for walls, bursts for kills)
   A fixed pool of small cubes is reused so we never allocate mid-game.
   ===================================================================== */
const particleGeo = new THREE.BoxGeometry(1, 1, 1);
const particleMats = {};
function particleMat(color) {
  if (!particleMats[color]) particleMats[color] = new THREE.MeshBasicMaterial({ color });
  return particleMats[color];
}
const PARTICLE_COUNT = 250;
const particles = [];
for (let i = 0; i < PARTICLE_COUNT; i++) {
  const m = new THREE.Mesh(particleGeo, particleMat(0xffffff));
  m.visible = false;
  scene.add(m);
  particles.push({ mesh: m, vel: new THREE.Vector3(), life: 0, maxLife: 1, size: 0.1, gravity: 1 });
}
let particleCursor = 0;

function spawnParticles(pos, count, color, speed, size, life, gravity = 1) {
  for (let i = 0; i < count; i++) {
    const p = particles[particleCursor];
    particleCursor = (particleCursor + 1) % PARTICLE_COUNT;
    p.mesh.material = particleMat(color);
    p.mesh.position.copy(pos);
    p.mesh.visible = true;
    p.vel.set(Math.random() * 2 - 1, Math.random() * 2 - 0.5, Math.random() * 2 - 1).normalize().multiplyScalar(speed * (0.4 + Math.random() * 0.8));
    p.life = p.maxLife = life * (0.6 + Math.random() * 0.6);
    p.size = size; p.gravity = gravity;
  }
}

function updateParticles(dt) {
  for (const p of particles) {
    if (p.life <= 0) continue;
    p.life -= dt;
    if (p.life <= 0) { p.mesh.visible = false; continue; }
    p.vel.y -= 12 * p.gravity * dt;
    p.mesh.position.addScaledVector(p.vel, dt);
    if (p.mesh.position.y < 0.02) { p.mesh.position.y = 0.02; p.vel.y *= -0.3; p.vel.x *= 0.6; p.vel.z *= 0.6; }
    const s = p.size * (p.life / p.maxLife);
    p.mesh.scale.set(s, s, s);
  }
}

/* =====================================================================
   Enemies — floating spiky orbs that chase you
   ===================================================================== */
const ER = CONFIG.enemy.radius;
const enemyBodyGeo = new THREE.SphereGeometry(ER, 20, 14);
const enemyEyeGeo = new THREE.SphereGeometry(ER * 0.28, 12, 8);
const enemySpikeGeo = new THREE.ConeGeometry(ER * 0.22, ER * 0.6, 8);
const enemyEyeMat = new THREE.MeshBasicMaterial({ color: 0xfff27a });
const enemySpikeMat = new THREE.MeshStandardMaterial({ color: 0x2a1010, roughness: 0.6 });
const enemies = [];

/** Colour shifts from red toward purple as waves get harder. */
function enemyColorForWave(wave) {
  const c = new THREE.Color(0xe0342b);
  return c.lerp(new THREE.Color(0x8a2be2), Math.min(1, (wave - 1) / 8));
}

function spawnEnemy() {
  // Find a free spot away from the player
  const pos = new THREE.Vector3();
  for (let tries = 0; tries < 30; tries++) {
    pos.set((Math.random() * 2 - 1) * (S - 3), 0, (Math.random() * 2 - 1) * (S - 3));
    const far = Math.hypot(pos.x - player.pos.x, pos.z - player.pos.z) > 16;
    const free = !obstacles.some((b) => b.max.y < WH && overlapsXZ(pos, ER + 0.3, b));
    if (far && free) break;
  }
  pos.y = 4;  // drop in from above

  const group = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: enemyColorForWave(state.wave), roughness: 0.45, metalness: 0.1, emissive: 0x000000 });
  const body = new THREE.Mesh(enemyBodyGeo, mat);
  body.castShadow = true;
  group.add(body);
  const eye = new THREE.Mesh(enemyEyeGeo, enemyEyeMat);
  eye.position.set(0, ER * 0.15, ER * 0.82);
  group.add(eye);
  for (let i = 0; i < 6; i++) {           // spikes around the body
    const spike = new THREE.Mesh(enemySpikeGeo, enemySpikeMat);
    const a = (i / 6) * Math.PI * 2;
    spike.position.set(Math.cos(a) * ER * 0.95, Math.sin(a) * ER * 0.95, -ER * 0.1);
    spike.rotation.z = a - Math.PI / 2;
    group.add(spike);
  }
  group.position.copy(pos);
  scene.add(group);

  const speed = state.enemySpeed * (1 + (Math.random() * 2 - 1) * CONFIG.enemy.speedVariance);
  const enemy = { group, mat, health: state.enemyHealth, speed, attackCd: 0, flash: 0, climb: 0, bobPhase: Math.random() * 6.28 };
  group.traverse((o) => { o.userData.enemy = enemy; });
  enemies.push(enemy);
  spawnParticles(pos, 10, 0xb070ff, 4, 0.15, 0.5, 0.3);
}

function removeEnemy(enemy) {
  scene.remove(enemy.group);
  enemy.mat.dispose();
  enemies.splice(enemies.indexOf(enemy), 1);
}

function damageEnemy(enemy, point) {
  enemy.health -= CONFIG.weapon.damage;
  enemy.flash = 0.09;                                   // white flash for 90 ms
  spawnParticles(point, 8, 0xffe08a, 6, 0.08, 0.35);    // sparks
  showHitmarker();
  Sound.hit();
  if (enemy.health <= 0) {
    spawnParticles(enemy.group.position, 26, enemy.mat.color.getHex(), 8, 0.22, 0.8);
    spawnParticles(enemy.group.position, 10, 0xfff27a, 5, 0.12, 0.5);
    Sound.kill();
    state.score += CONFIG.enemy.scorePerKill * state.wave;
    removeEnemy(enemy);
  }
}

const tmpSep = new THREE.Vector3();
function updateEnemies(dt, time) {
  const p = player;
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const g = e.group.position;
    const toX = p.pos.x - g.x, toZ = p.pos.z - g.z;
    const distXZ = Math.hypot(toX, toZ) || 1;

    // 1) Steer straight at the player
    let vx = (toX / distXZ) * e.speed;
    let vz = (toZ / distXZ) * e.speed;

    // 2) Separation: don't stack on top of each other
    tmpSep.set(0, 0, 0);
    for (const o of enemies) {
      if (o === e) continue;
      const dx = g.x - o.group.position.x, dz = g.z - o.group.position.z;
      const d2 = dx * dx + dz * dz;
      if (d2 < (ER * 2.4) ** 2 && d2 > 1e-6) {
        const d = Math.sqrt(d2);
        tmpSep.x += dx / d; tmpSep.z += dz / d;
      }
    }
    vx += tmpSep.x * 2.5; vz += tmpSep.z * 2.5;

    g.x += vx * dt;
    g.z += vz * dt;

    // 3) Walls/crates: slide along them; if blocked, float up and over
    if (collideCircle(g, ER, g.y - ER, g.y + ER)) e.climb = 0.8;
    e.climb -= dt;

    // 4) Height: hover around the player's chest height, or higher while climbing
    const bob = Math.sin(time * 4 + e.bobPhase) * 0.12;
    const targetY = Math.max(ER + 0.2, p.pos.y + 1.0) + (e.climb > 0 ? 2.2 : 0) + bob;
    const oldBottom = g.y - ER;
    g.y += clamp(targetY - g.y, -3.5 * dt, 3.5 * dt);
    for (const b of obstacles) {             // don't sink into box tops
      if (oldBottom >= b.max.y - 0.06 && g.y - ER < b.max.y && overlapsXZ(g, ER * 0.9, b)) g.y = b.max.y + ER;
    }

    // Face the player
    e.group.rotation.y = Math.atan2(toX, toZ);

    // 5) Contact damage
    e.attackCd -= dt;
    const py = clamp(g.y, p.pos.y + 0.3, p.pos.y + CONFIG.player.height - 0.3);
    const dy = g.y - py;
    const dist3 = Math.sqrt(toX * toX + toZ * toZ + dy * dy);
    if (dist3 < ER + CONFIG.player.radius + 0.15 && e.attackCd <= 0) {
      e.attackCd = CONFIG.enemy.attackCooldown;
      damagePlayer(CONFIG.enemy.contactDamage);
      g.x -= (toX / distXZ) * 1.2;          // knock the enemy back a bit
      g.z -= (toZ / distXZ) * 1.2;
      if (state.mode !== 'playing') return;
    }

    // Hit flash
    if (e.flash > 0) {
      e.flash -= dt;
      e.mat.emissive.setHex(e.flash > 0 ? 0xffffff : 0x000000);
    }
  }
}

/* =====================================================================
   Player
   ===================================================================== */
const player = {
  pos: new THREE.Vector3(),   // feet position
  vel: new THREE.Vector3(),
  yaw: 0, pitch: 0,
  onGround: true,
  health: CONFIG.player.maxHealth,
  bobTime: 0,
};

function damagePlayer(amount) {
  player.health = Math.max(0, player.health - amount);
  state.damageFlash = 1;
  Sound.hurt();
  if (player.health <= 0) gameOver();
}

function updatePlayer(dt) {
  const P = CONFIG.player, p = player;

  // Input direction relative to where we're looking
  let fx = 0, fz = 0;
  if (keys.KeyW) fz -= 1;
  if (keys.KeyS) fz += 1;
  if (keys.KeyA) fx -= 1;
  if (keys.KeyD) fx += 1;
  const len = Math.hypot(fx, fz);
  if (len > 0) { fx /= len; fz /= len; }
  const sprinting = (keys.ShiftLeft || keys.ShiftRight) && len > 0;
  const speed = sprinting ? P.sprintSpeed : P.walkSpeed;
  const sin = Math.sin(p.yaw), cos = Math.cos(p.yaw);
  const wishX = (fx * cos + fz * sin) * speed;
  const wishZ = (-fx * sin + fz * cos) * speed;

  // Smooth acceleration (less control in the air)
  const accel = p.onGround ? 14 : 4;
  const k = Math.min(1, accel * dt);
  p.vel.x += (wishX - p.vel.x) * k;
  p.vel.z += (wishZ - p.vel.z) * k;

  // Horizontal move + collision
  p.pos.x += p.vel.x * dt;
  p.pos.z += p.vel.z * dt;
  collideCircle(p.pos, P.radius, p.pos.y, p.pos.y + P.height);

  // Jump + gravity
  if (keys.Space && p.onGround) { p.vel.y = P.jumpSpeed; p.onGround = false; Sound.jump(); }
  p.vel.y -= P.gravity * dt;
  const oldY = p.pos.y;
  p.pos.y += p.vel.y * dt;
  p.onGround = false;
  if (p.pos.y <= 0) { p.pos.y = 0; p.vel.y = 0; p.onGround = true; }
  for (const b of obstacles) {   // land on top of boxes
    if (oldY >= b.max.y - 0.06 && p.pos.y < b.max.y && overlapsXZ(p.pos, P.radius * 0.85, b)) {
      p.pos.y = b.max.y; p.vel.y = 0; p.onGround = true;
    }
  }

  // Camera follows the head, with a little bob when walking
  const moving = p.onGround && Math.hypot(p.vel.x, p.vel.z) > 0.5;
  if (moving) p.bobTime += dt * (sprinting ? 14 : 10);
  const bob = moving ? Math.sin(p.bobTime) * 0.045 : 0;
  camera.position.set(p.pos.x, p.pos.y + P.eyeHeight + bob, p.pos.z);
  camera.rotation.set(p.pitch, p.yaw, 0);

  return { moving, sprinting };
}

/* =====================================================================
   Shooting, recoil, reload
   ===================================================================== */
const raycaster = new THREE.Raycaster();
const screenCentre = new THREE.Vector2(0, 0);
const weapon = { ammo: CONFIG.weapon.magSize, cooldown: 0, reloading: false, reloadTimer: 0, recoil: 0, flashTimer: 0 };

function shoot() {
  if (weapon.reloading || weapon.cooldown > 0) return;
  if (weapon.ammo <= 0) { Sound.empty(); weapon.cooldown = 0.25; startReload(); return; }

  weapon.ammo--;
  weapon.cooldown = 1 / CONFIG.weapon.fireRate;
  weapon.recoil = 1;
  weapon.flashTimer = 0.05;
  player.pitch = Math.min(Math.PI / 2 - 0.01, player.pitch + CONFIG.weapon.recoilKick);
  muzzleFlash.rotation.z = Math.random() * Math.PI;
  muzzleFlash.scale.setScalar(0.8 + Math.random() * 0.5);
  Sound.shoot();

  // Hitscan ray from the centre of the screen
  raycaster.setFromCamera(screenCentre, camera);
  raycaster.far = CONFIG.weapon.range;
  const targets = solidMeshes.concat(enemies.map((e) => e.group));
  const hits = raycaster.intersectObjects(targets, true);
  if (hits.length) {
    const hit = hits[0];
    const enemy = hit.object.userData.enemy;
    if (enemy) damageEnemy(enemy, hit.point);
    else {
      // Bullet hit a wall/crate/floor: small dust puff, nudged off the surface
      const n = hit.face ? hit.face.normal.clone().transformDirection(hit.object.matrixWorld) : new THREE.Vector3(0, 1, 0);
      spawnParticles(hit.point.clone().addScaledVector(n, 0.05), 5, 0xd8d0c0, 2.5, 0.06, 0.4);
    }
  }
  if (weapon.ammo === 0) startReload();
}

function startReload() {
  if (weapon.reloading || weapon.ammo === CONFIG.weapon.magSize) return;
  weapon.reloading = true;
  weapon.reloadTimer = CONFIG.weapon.reloadTime;
  Sound.reload();
}

const muzzleWorld = new THREE.Vector3();
function updateWeapon(dt, moveInfo) {
  weapon.cooldown -= dt;
  if (mouseDown) shoot();

  if (weapon.reloading) {
    weapon.reloadTimer -= dt;
    if (weapon.reloadTimer <= 0) { weapon.reloading = false; weapon.ammo = CONFIG.weapon.magSize; }
  }

  // Recoil springs back
  weapon.recoil = Math.max(0, weapon.recoil - dt * 9);
  // Reload animation: gun dips down and tilts, then comes back
  const r = weapon.reloading ? Math.sin((1 - weapon.reloadTimer / CONFIG.weapon.reloadTime) * Math.PI) : 0;
  // Walk sway
  const sway = moveInfo.moving ? player.bobTime : 0;
  gun.position.set(
    GUN_REST.x + Math.cos(sway * 0.5) * 0.012,
    GUN_REST.y - Math.abs(Math.sin(sway * 0.5)) * 0.008 - r * 0.1 - (moveInfo.sprinting ? 0.03 : 0),
    GUN_REST.z + weapon.recoil * 0.045
  );
  gun.rotation.set(weapon.recoil * 0.18 - r * 0.7, (moveInfo.sprinting ? 0.25 : 0), r * 0.4);

  // Muzzle flash + light
  weapon.flashTimer -= dt;
  const flashing = weapon.flashTimer > 0;
  muzzleFlash.visible = flashing;
  camera.getWorldDirection(muzzleWorld);
  muzzleLight.position.copy(camera.position).addScaledVector(muzzleWorld, 0.8);
  muzzleLight.intensity = flashing ? 25 : 0;
}

/* =====================================================================
   Waves
   ===================================================================== */
const state = {
  mode: 'menu',           // 'menu' | 'playing' | 'paused' | 'over'
  score: 0, wave: 0,
  toSpawn: 0, spawnTimer: 0, intermission: 0,
  enemySpeed: CONFIG.enemy.baseSpeed, enemyHealth: CONFIG.enemy.baseHealth,
  damageFlash: 0, bannerTimer: 0,
};

function startWave(n) {
  const W = CONFIG.waves, E = CONFIG.enemy;
  state.wave = n;
  state.toSpawn = W.baseCount + (n - 1) * W.extraPerWave;
  state.spawnTimer = 0.5;
  state.enemySpeed = Math.min(E.maxSpeed, E.baseSpeed + (n - 1) * E.speedPerWave);
  state.enemyHealth = E.baseHealth + Math.floor((n - 1) / E.healthEveryNWaves);
  showBanner(`WAVE ${n}`);
  Sound.wave();
}

function updateWaves(dt) {
  if (state.intermission > 0) {
    state.intermission -= dt;
    if (state.intermission <= 0) startWave(state.wave + 1);
    return;
  }
  if (state.toSpawn > 0) {
    state.spawnTimer -= dt;
    if (state.spawnTimer <= 0 && enemies.length < CONFIG.waves.maxAlive) {
      spawnEnemy();
      state.toSpawn--;
      state.spawnTimer = CONFIG.waves.spawnInterval;
    }
  } else if (enemies.length === 0) {
    // Wave cleared
    state.score += CONFIG.waves.clearBonusPerWave * state.wave;
    player.health = Math.min(CONFIG.player.maxHealth, player.health + CONFIG.waves.healOnClear);
    state.intermission = CONFIG.waves.timeBetweenWaves;
    showBanner('WAVE CLEARED');
  }
}

/* =====================================================================
   HUD helpers
   ===================================================================== */
let hitTimer = 0;
function showHitmarker() { ui.hitmarker.classList.add('show'); hitTimer = 0.08; }
function showBanner(text) { ui.banner.textContent = text; ui.banner.classList.add('show'); state.bannerTimer = 1.8; }

const hudCache = {};
function setText(el, key, value) { if (hudCache[key] !== value) { hudCache[key] = value; el.innerHTML = value; } }

function updateHUD(dt) {
  const hp = Math.ceil(player.health);
  const frac = player.health / CONFIG.player.maxHealth;
  setText(ui.healthText, 'hp', String(hp));
  ui.healthFill.style.width = (frac * 100).toFixed(1) + '%';
  ui.healthFill.style.background = frac > 0.5 ? '#3ddc6a' : frac > 0.25 ? '#ffc23d' : '#ff4a3d';
  setText(ui.ammo, 'ammo', `${weapon.ammo}<small> / ${CONFIG.weapon.magSize}</small>`);
  setText(ui.reloadText, 'reload', weapon.reloading ? 'RELOADING…' : weapon.ammo === 0 ? 'PRESS R' : '');
  setText(ui.score, 'score', String(state.score));
  setText(ui.wave, 'wave', String(state.wave));
  setText(ui.enemiesLeft, 'left', `${enemies.length + state.toSpawn} enemies left`);

  state.damageFlash = Math.max(0, state.damageFlash - dt * 2.5);
  ui.damage.style.opacity = state.damageFlash.toFixed(2);
  if (hitTimer > 0 && (hitTimer -= dt) <= 0) ui.hitmarker.classList.remove('show');
  if (state.bannerTimer > 0 && (state.bannerTimer -= dt) <= 0) ui.banner.classList.remove('show');
}

/* =====================================================================
   Input
   ===================================================================== */
const keys = {};
let mouseDown = false;
const canvas = renderer.domElement;

document.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'KeyR' && state.mode === 'playing') startReload();
  if (e.code === 'Space') e.preventDefault();
});
document.addEventListener('keyup', (e) => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouseDown = false; });

document.addEventListener('mousedown', (e) => {
  if (e.button === 0 && state.mode === 'playing') { mouseDown = true; shoot(); }
});
document.addEventListener('mouseup', (e) => { if (e.button === 0) mouseDown = false; });

document.addEventListener('mousemove', (e) => {
  if (state.mode !== 'playing' || document.pointerLockElement !== canvas) return;
  // Some browsers report a huge jump right after pointer lock starts; ignore those spikes
  if (Math.abs(e.movementX) > 250 || Math.abs(e.movementY) > 250) return;
  player.yaw -= e.movementX * CONFIG.player.mouseSensitivity;
  player.pitch -= e.movementY * CONFIG.player.mouseSensitivity;
  player.pitch = clamp(player.pitch, -Math.PI / 2 + 0.01, Math.PI / 2 - 0.01);
});

/** Ask for pointer lock; some browsers return a promise that can reject. */
function lockPointer() {
  try {
    const r = canvas.requestPointerLock();
    if (r && r.catch) r.catch(() => {});
  } catch (_) { /* ignored: game still runs without lock */ }
}

// Losing pointer lock (Esc) pauses the game
let hadLock = false;
document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement === canvas) { hadLock = true; return; }
  if (state.mode === 'playing' && hadLock) {
    state.mode = 'paused';
    mouseDown = false;
    ui.pause.classList.remove('hidden');
  }
});

/* =====================================================================
   Game flow: start, pause, game over, restart
   ===================================================================== */
function resetGame() {
  while (enemies.length) removeEnemy(enemies[0]);
  for (const p of particles) { p.life = 0; p.mesh.visible = false; }
  player.pos.set(5, 0, 16);
  player.vel.set(0, 0, 0);
  player.yaw = 0; player.pitch = 0;
  player.health = CONFIG.player.maxHealth;
  weapon.ammo = CONFIG.weapon.magSize;
  weapon.reloading = false; weapon.cooldown = 0; weapon.recoil = 0;
  state.score = 0; state.wave = 0; state.toSpawn = 0;
  state.intermission = 1.2;     // short breather, then wave 1
  state.damageFlash = 0;
}

function beginPlaying() {
  Sound.init();
  state.mode = 'playing';
  ui.start.classList.add('hidden');
  ui.over.classList.add('hidden');
  ui.pause.classList.add('hidden');
  ui.hud.classList.remove('hidden');
  lockPointer();
}

function gameOver() {
  state.mode = 'over';
  updateHUD(0);            // show the final 0 health on the HUD behind the menu
  mouseDown = false;
  hadLock = false;
  if (document.pointerLockElement) document.exitPointerLock();
  ui.finalScore.textContent = state.score;
  ui.finalWave.textContent = `You reached wave ${state.wave}`;
  ui.over.classList.remove('hidden');
}

$('start-btn').addEventListener('click', () => { resetGame(); beginPlaying(); });
$('restart-btn').addEventListener('click', () => { resetGame(); beginPlaying(); });
$('resume-btn').addEventListener('click', () => beginPlaying());

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = gunCamera.aspect = w / h;
  camera.updateProjectionMatrix();
  gunCamera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

/* =====================================================================
   Main loop
   ===================================================================== */
const clock = new THREE.Clock();
let fpsFrames = 0, fpsTime = 0;
resetGame();
camera.position.set(5, CONFIG.player.eyeHeight, 16);

function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);   // clamp so a lag spike can't tunnel through walls
  const time = clock.elapsedTime;

  if (state.mode === 'playing') {
    const moveInfo = updatePlayer(dt);
    updateWeapon(dt, moveInfo);
    updateWaves(dt);
    updateEnemies(dt, time);
    updateHUD(dt);
  }
  updateParticles(dt);

  // FPS readout
  fpsFrames++; fpsTime += dt;
  if (fpsTime >= 0.5) { ui.fps.textContent = `${Math.round(fpsFrames / fpsTime)} FPS`; fpsFrames = 0; fpsTime = 0; }

  renderer.clear();
  renderer.render(scene, camera);
  renderer.clearDepth();
  renderer.render(gunScene, gunCamera);
}
frame();

// Handy for debugging in the browser console: e.g. __game.CONFIG.enemy.baseSpeed = 5
window.__game = { CONFIG, state, player, enemies, weapon, spawnEnemy, damagePlayer, renderer };
</script>
