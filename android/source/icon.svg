<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 432" width="432" height="432">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#2a3550"/>
      <stop offset="0.55" stop-color="#121826"/>
      <stop offset="1" stop-color="#06080d"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0" stop-color="#ff6a2b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff6a2b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="helm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d6b52"/>
      <stop offset="0.6" stop-color="#3a4535"/>
      <stop offset="1" stop-color="#232a20"/>
    </linearGradient>
    <linearGradient id="helmHi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b4a33"/>
      <stop offset="0.5" stop-color="#9a6b4b"/>
      <stop offset="1" stop-color="#5a3d2a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f4a38"/>
      <stop offset="1" stop-color="#151a13"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.5" stop-color="#ff7a2b"/>
      <stop offset="1" stop-color="#c2310f"/>
    </linearGradient>
    <filter id="lensGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!--BG-->
  <g id="fg">
    <circle cx="216" cy="206" r="150" fill="url(#glow)"/>
    <!-- crosshair ring -->
    <g stroke="#ff6a2b" stroke-width="5" fill="none" opacity="0.95">
      <circle cx="216" cy="206" r="128" stroke-dasharray="150 51" transform="rotate(-62 216 206)"/>
    </g>
    <g fill="#ff6a2b">
      <rect x="211" y="62" width="10" height="34" rx="3"/>
      <rect x="62" y="201" width="34" height="10" rx="3"/>
      <rect x="336" y="201" width="34" height="10" rx="3"/>
    </g>
    <g filter="url(#shadow)">
      <!-- shoulders / plate carrier -->
      <path d="M86 372 C 92 318, 130 292, 178 284 L 254 284 C 302 292, 340 318, 346 372 L 360 700 L 72 700 Z" fill="url(#body)"/>
      <path d="M150 300 L 282 300 L 296 700 L 136 700 Z" fill="#2a3224"/>
      <rect x="160" y="318" width="34" height="40" rx="5" fill="#364030"/>
      <rect x="199" y="318" width="34" height="40" rx="5" fill="#364030"/>
      <rect x="238" y="318" width="34" height="40" rx="5" fill="#364030"/>
      <!-- neck -->
      <path d="M190 250 L 242 250 L 248 292 L 184 292 Z" fill="#5a3d2a"/>
      <!-- face / jaw -->
      <path d="M156 176 C 156 236, 176 268, 216 272 C 256 268, 276 236, 276 176 Z" fill="url(#face)"/>
      <!-- balaclava lower face -->
      <path d="M160 214 C 166 252, 186 270, 216 272 C 246 270, 266 252, 272 214 C 252 226, 236 230, 216 230 C 196 230, 180 226, 160 214 Z" fill="#1d221b"/>
      <!-- helmet -->
      <path d="M128 182 C 126 112, 168 78, 216 78 C 264 78, 306 112, 304 182 C 304 190, 298 194, 290 194 L 142 194 C 134 194, 128 190, 128 182 Z" fill="url(#helm)"/>
      <path d="M150 120 C 170 92, 200 86, 222 86 C 190 96, 168 112, 158 140 Z" fill="url(#helmHi)"/>
      <!-- helmet strap rail + NVG mount -->
      <rect x="198" y="96" width="36" height="22" rx="5" fill="#252c22"/>
      <rect x="120" y="176" width="192" height="16" rx="8" fill="#2b3327"/>
      <!-- goggles -->
      <rect x="150" y="186" width="132" height="40" rx="18" fill="#0d0f0c"/>
      <g filter="url(#lensGlow)">
        <rect x="160" y="192" width="50" height="28" rx="12" fill="url(#lens)"/>
        <rect x="222" y="192" width="50" height="28" rx="12" fill="url(#lens)"/>
      </g>
      <path d="M166 197 L 186 197 L 172 212 Z" fill="#fff" opacity="0.55"/>
      <path d="M228 197 L 248 197 L 234 212 Z" fill="#fff" opacity="0.55"/>
    </g>
  </g>
</svg>
